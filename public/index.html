<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aivora AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#0d172d;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
}

.container{
width:100%;
max-width:520px;
margin:auto;
}

h1{
font-size:34px;
color:#38bdf8;
margin:15px 0;
}

h2{
font-size:22px;
line-height:1.6;
margin:15px 0 25px;
}

textarea{

width:100%;
height:160px;

border-radius:22px;
border:none;

padding:18px;

font-size:18px;

resize:none;

text-align:right;

}


button{

margin-top:20px;

background:#38bdf8;

border:none;

border-radius:50px;

padding:15px 55px;

font-size:22px;

cursor:pointer;

}


#result{

margin-top:25px;

background:#1e293b;

border-radius:22px;

padding:20px;

font-size:17px;

line-height:1.8;

min-height:100px;

white-space:pre-wrap;

word-break:break-word;

}


</style>

</head>


<body>


<div class="container">


<h1>🚀 Aivora AI</h1>


<h2>
منصة الذكاء الاصطناعي لصناعة<br>
الأفكار والمحتوى
</h2>


<textarea id="input" placeholder="اكتب طلبك هنا..."></textarea>


<button onclick="generate()">
إنشاء
</button>


<div id="result">
النتيجة ستظهر هنا
</div>


</div>



<script>


async function generate(){


const input =
document.getElementById("input").value;


const result =
document.getElementById("result");



if(!input.trim()){

result.innerText =
"اكتب طلبك أولاً";

return;

}



result.innerText =
"جاري المعالجة...";



try{


const response = await fetch("/api/generate",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

input:input

})

});



const data = await response.json();



if(data.result){

if(typeof data.result === "string"){

try{

const json = JSON.parse(data.result);

let text = "";

if(json.title){
text += json.title + "\n\n";
}

if(json.sections){

json.sections.forEach(section=>{

if(section.title){
text += "🔹 " + section.title + "\n";
}

if(section.text){
text += section.text + "\n\n";
}

});

}

result.innerText = text || data.result;

}catch{

result.innerText = data.result;

}

}else{

result.innerText = JSON.stringify(data.result, null, 2);

}

}else if(data.error){

result.innerText = data.error;

}else{

result.innerText = "لا يوجد رد";

}



}catch(error){


result.innerText =
"حدث خطأ: " + error.message;


}


}


</script>


</body>

</html>

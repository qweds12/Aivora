<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Aivora AI</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#0d172d;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

.container{
width:100%;
max-width:600px;
margin:auto;
}

.logo{
font-size:45px;
font-weight:bold;
color:#38bdf8;
margin-top:20px;
}

h1{
font-size:35px;
margin:30px 0;
}

textarea{
width:100%;
height:260px;
border-radius:30px;
border:none;
padding:25px;
font-size:22px;
resize:none;
outline:none;
}

button{
margin-top:35px;
background:#38bdf8;
color:#000;
border:none;
border-radius:50px;
padding:22px 70px;
font-size:25px;
}

#result{

margin-top:40px;
background:#1e293b;
border-radius:30px;
padding:25px;

font-size:20px;
line-height:2;

min-height:100px;

white-space:pre-wrap;
word-wrap:break-word;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
🚀 Aivora AI
</div>


<h1>
منصة الذكاء الاصطناعي لصناعة<br>
الأفكار والمحتوى
</h1>



<textarea id="input" placeholder="اكتب طلبك هنا..."></textarea>



<button onclick="generate()">
إنشاء
</button>



<div id="result">
النتيجة ستظهر هنا
</div>



</div>




<script>


async function generate(){


let input=document.getElementById("input").value;


let result=document.getElementById("result");



if(!input.trim()){

result.innerText="اكتب طلبك أولاً";

return;

}



result.innerText="جاري المعالجة...";



try{


let response=await fetch("/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

input:input

})


});



let data=await response.json();



if(typeof data==="object"){


if(data.result){

result.innerText=data.result;

}

else{

result.innerText=
JSON.stringify(data,null,2);

}


}

else{


result.innerText=data;


}



}

catch(error){


result.innerText=
"حدث خطأ: "+error.message;


}



}


</script>


</body>
</html>

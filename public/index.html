<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aivora AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
background:#0d172d;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

.container{
width:100%;
max-width:600px;
margin:auto;
}

h1{
font-size:38px;
color:#38bdf8;
margin:20px 0;
}

h2{
font-size:24px;
line-height:1.6;
margin:25px 0;
}

textarea{
width:100%;
height:220px;
border-radius:25px;
border:none;
padding:20px;
font-size:20px;
resize:none;
direction:rtl;
}

button{
margin-top:25px;
background:#38bdf8;
color:#001;
border:none;
border-radius:50px;
padding:18px 60px;
font-size:24px;
cursor:pointer;
}

button:active{
transform:scale(.97);
}

#result{
margin-top:35px;
background:#1e293b;
border-radius:25px;
padding:25px;
font-size:20px;
min-height:100px;
word-wrap:break-word;
overflow-wrap:anywhere;
}


@media(max-width:500px){

h1{
font-size:32px;
}

h2{
font-size:21px;
}

textarea{
height:180px;
font-size:18px;
}

button{
font-size:22px;
padding:16px 50px;
}

#result{
font-size:18px;
}

}

</style>

</head>


<body>

<div class="container">


<h1>Aivora AI 🚀</h1>


<h2>
منصة الذكاء الاصطناعي لصناعة<br>
الأفكار والمحتوى
</h2>


<textarea id="input" placeholder="اكتب طلبك هنا..."></textarea>


<button onclick="generate()">
إنشاء
</button>


<div id="result">
النتيجة ستظهر هنا
</div>


</div>



<script>

async function generate(){

let input=document.getElementById("input").value.trim();

let result=document.getElementById("result");


if(!input){

result.innerHTML="اكتب طلبك أولاً";
return;

}


result.innerHTML="جاري المعالجة...";


try{


let response=await fetch("/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
input:input
})

});


let data=await response.json();


if(typeof data.result==="object"){

result.innerHTML=JSON.stringify(data.result,null,2);

}else{

result.innerHTML=data.result || "لم يتم إنشاء نتيجة";

}


}


catch(error){

result.innerHTML="حدث خطأ في الاتصال";

}


}

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aivora AI</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

.container{
    padding:50px 20px;
}

h1{
    font-size:55px;
    color:#38bdf8;
}

p{
    font-size:28px;
}

textarea{
    width:85%;
    height:250px;
    border-radius:25px;
    padding:20px;
    font-size:22px;
    border:none;
    margin-top:30px;
}

button{
    margin-top:30px;
    padding:20px 70px;
    border:none;
    border-radius:40px;
    background:#38bdf8;
    font-size:25px;
    cursor:pointer;
}

#result{
    margin-top:40px;
    background:#1e293b;
    padding:30px;
    border-radius:25px;
    font-size:22px;
}
</style>

</head>

<body>

<div class="container">

<h1>Aivora AI 🚀</h1>

<p>
منصة الذكاء الاصطناعي لصناعة الأفكار والمحتوى
</p>


<textarea id="input" placeholder="اكتب طلبك هنا..."></textarea>


<br>

<button onclick="generate()">
إنشاء
</button>


<div id="result">
النتيجة ستظهر هنا
</div>


</div>


<script>

async function generate(){

let input = document.getElementById("input").value;


if(!input.trim()){

document.getElementById("result").innerHTML =
"اكتب طلبك أولاً";

return;

}


document.getElementById("result").innerHTML =
"جاري المعالجة...";


try{


let response = await fetch("/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

input: input

})

});


let data = await response.json();


document.getElementById("result").innerHTML =
data.result || data.error;


}

catch(error){

document.getElementById("result").innerHTML =
"حدث خطأ في الاتصال";

}


}

</script>


</body>
</html>

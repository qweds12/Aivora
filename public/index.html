<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aivora AI</title>

<style>

body{

margin:0;
padding:20px;
background:#0d172d;
color:white;
font-family:Arial,sans-serif;
text-align:center;

}


h1{

font-size:55px;
color:#38bdf8;
margin-top:30px;

}


h2{

font-size:35px;
line-height:1.8;
margin:40px 0;

}


.container{

max-width:600px;
margin:auto;

}


textarea{

width:90%;
height:250px;
border-radius:30px;
border:none;
padding:25px;
font-size:25px;
text-align:right;
resize:none;

}


button{

margin-top:40px;
background:#38bdf8;
border:none;
border-radius:50px;
padding:25px 80px;
font-size:30px;
cursor:pointer;

}


#result{

margin-top:50px;
background:#1e293b;
border-radius:30px;
padding:30px;
font-size:25px;
line-height:1.8;
min-height:80px;
text-align:right;
word-wrap:break-word;

}


#result h3{

color:#38bdf8;
text-align:center;

}


#result h4{

color:#38bdf8;

}


</style>

</head>


<body>


<div class="container">


<h1>
Aivora AI 🚀
</h1>


<h2>
منصة الذكاء الاصطناعي لصناعة<br>
الأفكار والمحتوى
</h2>



<textarea 
id="input"
placeholder="اكتب طلبك هنا...">
</textarea>



<br>


<button onclick="generate()">
إنشاء
</button>



<div id="result">

النتيجة ستظهر هنا

</div>


</div>



<script>


async function generate(){


let input=document.getElementById("input").value;

let result=document.getElementById("result");


if(!input){

result.innerHTML="اكتب طلبك أولاً";
return;

}



result.innerHTML="جاري المعالجة...";



try{


let response = await fetch("/api/generate",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

input:input

})

});



let data = await response.json();



let output=data.result || data;



if(typeof output==="object"){


let html="";



if(output.title){

html += "<h3>"+output.title+"</h3>";

}



if(output.sections){


output.sections.forEach(section=>{


html += "<h4>"+(section.title || "")+"</h4>";

html += "<p>"+(section.text || "")+"</p>";



});


}



result.innerHTML=html;



}else{


result.innerHTML=output;



}



}

catch(error){


result.innerHTML="حدث خطأ: "+error;


}



}


</script>



</body>

</html>

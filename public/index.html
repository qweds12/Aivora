<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aivora AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
background:#0d172d;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
}

.container{
width:100%;
max-width:600px;
margin:auto;
}

h1{
font-size:38px;
color:#38bdf8;
margin:20px 0;
}

h2{
font-size:26px;
line-height:1.6;
margin:20px 0 35px;
}

textarea{
width:100%;
height:220px;
border-radius:25px;
border:none;
padding:20px;
font-size:22px;
resize:none;
text-align:right;
}

button{
margin-top:30px;
background:#38bdf8;
border:none;
border-radius:50px;
padding:18px 70px;
font-size:25px;
cursor:pointer;
}

#result{
margin-top:35px;
background:#1e293b;
border-radius:25px;
padding:25px;
font-size:20px;
line-height:1.8;
min-height:100px;
white-space:pre-wrap;
word-break:break-word;
overflow-wrap:break-word;
}

</style>

</head>


<body>

<div class="container">

<h1>Aivora AI 🚀</h1>

<h2>
منصة الذكاء الاصطناعي لصناعة<br>
الأفكار والمحتوى
</h2>


<textarea id="input" placeholder="اكتب طلبك هنا..."></textarea>


<br>

<button onclick="generate()">
إنشاء
</button>


<div id="result">
النتيجة ستظهر هنا
</div>


</div>


<script>

async function generate(){

let input = document.getElementById("input").value;

let result = document.getElementById("result");


if(!input.trim()){

result.innerText="اكتب طلبك أولاً";
return;

}


result.innerText="جاري المعالجة...";


try{


let response = await fetch("/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
input:input
})

});


let data = await response.json();


if(data.error){

result.innerText=data.error;
return;

}


// معالجة كل أنواع الردود

if(typeof data.result === "string"){

result.innerText=data.result;

}

else if(typeof data.result === "object"){

let text="";


if(data.result.title){

text += data.result.title + "\n\n";

}


if(data.result.sections){

data.result.sections.forEach(section=>{


if(section.title){

text += "🔹 " + section.title + "\n";

}


if(section.text){

text += section.text + "\n\n";

}


});

}


result.innerText = text || JSON.stringify(data.result,null,2);


}

else{

result.innerText="لا توجد نتيجة";

}



}catch(error){


result.innerText="حدث خطأ: " + error.message;


}


}


</script>


</body>

</html>
